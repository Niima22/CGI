<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640">
  <defs>
    <linearGradient id="header" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#d7eaff"/>
    </linearGradient>
    <linearGradient id="systemBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#e9f6ff"/>
    </linearGradient>
    <linearGradient id="usecase" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8ee0fb"/>
      <stop offset="1" stop-color="#50c3e9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <style>
      .title { font: 700 20px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .system-title { font: 700 16px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .actor-name { font: 14px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .actor-line { stroke: #000; stroke-width: 1.5; fill: none; stroke-linecap: round; }
      .usecase { fill: url(#usecase); stroke: #000; stroke-width: 1; }
      .usecase-text { font: 13px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .association { stroke: #000; stroke-width: 1.2; fill: none; }
      .include { stroke: #000; stroke-width: 1.1; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      .include-text { font: 12px Arial, sans-serif; fill: #111; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="640" fill="#ffffff"/>
  <rect x="28" y="28" width="804" height="32" fill="url(#header)" stroke="#000"/>
