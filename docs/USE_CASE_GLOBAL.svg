  <!-- Common use cases -->
  <ellipse id="uc01" class="usecase" cx="580" cy="245" rx="170" ry="34" />
  <text class="usecase-text" x="580" y="237"><tspan x="580" dy="0">Consulter son profil</tspan><tspan x="580" dy="17">authentifie</tspan></text>

  <ellipse id="uc02" class="usecase" cx="580" cy="320" rx="170" ry="34" />
  <text class="usecase-text" x="580" y="320">Creer un ticket</text>

