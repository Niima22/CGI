  <ellipse id="uc05" class="usecase" cx="580" cy="545" rx="170" ry="34" />
  <text class="usecase-text" x="580" y="537"><tspan x="580" dy="0">Consulter le statut SLA</tspan><tspan x="580" dy="17">d'un ticket</tspan></text>

  <ellipse id="uc06" class="usecase" cx="580" cy="620" rx="170" ry="34" />
  <text class="usecase-text" x="580" y="620">Gerer ses notifications</text>

  <ellipse id="uc07" class="usecase" cx="580" cy="695" rx="170" ry="34" />
  <text class="usecase-text" x="580" y="695">Consulter son planning</text>

  <ellipse id="uc08" class="usecase" cx="580" cy="770" rx="170" ry="34" />
  <text class="usecase-text" x="580" y="762"><tspan x="580" dy="0">Soumettre une demande</tspan><tspan x="580" dy="17">(conge ou echange)</tspan></text>

  <!-- Supervision use cases -->
  <ellipse id="uc09" class="usecase" cx="1160" cy="245" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="237"><tspan x="1160" dy="0">Consulter le dashboard</tspan><tspan x="1160" dy="17">et les KPI</tspan></text>

  <ellipse id="uc10" class="usecase" cx="1160" cy="320" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="320">Exporter un rapport PDF</text>

  <ellipse id="uc11" class="usecase" cx="1160" cy="395" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="387"><tspan x="1160" dy="0">Affecter / reaffecter</tspan><tspan x="1160" dy="17">un ticket</tspan></text>

  <ellipse id="uc12" class="usecase" cx="1160" cy="470" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="462"><tspan x="1160" dy="0">Statuer sur une demande</tspan><tspan x="1160" dy="17">de planning</tspan></text>

  <ellipse id="uc13" class="usecase" cx="1160" cy="545" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="537"><tspan x="1160" dy="0">Gerer les shifts</tspan><tspan x="1160" dy="17">du planning</tspan></text>

  <!-- Admin use cases -->
  <ellipse id="uc14" class="usecase-admin" cx="1160" cy="705" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="705">Creer un utilisateur</text>

  <ellipse id="uc15" class="usecase-admin" cx="1160" cy="775" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="775">Gerer les roles</text>

  <ellipse id="uc16" class="usecase-admin" cx="1160" cy="845" rx="190" ry="34" />
  <text class="usecase-text" x="1160" y="837"><tspan x="1160" dy="0">Gerer les departements</tspan><tspan x="1160" dy="17">et affectations</tspan></text>

  <!-- AI use case -->
  <ellipse id="uc17" class="usecase-ai" cx="1160" cy="960" rx="205" ry="36" />
  <text class="usecase-text" x="1160" y="952"><tspan x="1160" dy="0">Obtenir une assistance IA</tspan><tspan x="1160" dy="17">a la resolution</tspan></text>

