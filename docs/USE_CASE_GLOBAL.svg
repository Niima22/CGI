<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .system { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .package { fill: #f3f6fb; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .package-title { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .actor-line { stroke: #111827; stroke-width: 3; fill: none; stroke-linecap: round; }
      .actor-label { font: 700 17px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .usecase { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .usecase-admin { fill: #ffffff; stroke: #7c3aed; stroke-width: 2; }
      .usecase-ai { fill: #ffffff; stroke: #059669; stroke-width: 2; }
      .usecase-text { font: 600 14px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .association { stroke: #374151; stroke-width: 1.4; fill: none; opacity: .72; }
      .dependency { stroke: #6b7280; stroke-width: 1.4; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .dependency-label { font: 600 12px Arial, sans-serif; fill: #4b5563; }
      .legend-title { font: 700 15px Arial, sans-serif; fill: #111827; }
      .legend-text { font: 400 13px Arial, sans-serif; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1120" />
  <text class="title" x="800" y="42" text-anchor="middle">Diagramme global des cas d'utilisation - CGI-FLOW</text>
  <text class="subtitle" x="800" y="68" text-anchor="middle">Acteurs : Employe, Superviseur, Pilote et Moteur IA</text>

  <rect class="system" x="315" y="95" width="1215" height="965" rx="14" />
  <text class="package-title" x="338" y="128">Systeme CGI-FLOW</text>

  <rect class="package" x="345" y="155" width="465" height="750" />
  <text class="package-title" x="370" y="185">Fonctionnalites communes</text>

  <rect class="package" x="850" y="155" width="625" height="445" />
  <text class="package-title" x="875" y="185">Pilotage et supervision</text>

  <rect class="package" x="850" y="625" width="625" height="235" />
  <text class="package-title" x="875" y="655">Administration Pilote</text>

  <rect class="package" x="850" y="885" width="625" height="120" />
  <text class="package-title" x="875" y="915">Assistance IA</text>

  <!-- Actors -->
  <circle cx="135" cy="190" r="20" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <path class="actor-line" d="M135 210 L135 275 M92 235 L178 235 M135 275 L95 335 M135 275 L175 335" />
  <text class="actor-label" x="135" y="365">Employe</text>

  <circle cx="135" cy="495" r="20" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <path class="actor-line" d="M135 515 L135 580 M92 540 L178 540 M135 580 L95 640 M135 580 L175 640" />
  <text class="actor-label" x="135" y="670">Superviseur</text>

