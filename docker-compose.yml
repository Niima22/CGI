services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: cgi-flow-auth-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cgi_flow_auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "55432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cgi_flow_auth}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kpi-postgres:
    image: postgres:16-alpine
    container_name: cgi-flow-kpi-postgres
    environment:
      POSTGRES_DB: ${KPI_PLATFORM_BOOTSTRAP_DB:-postgres}
      POSTGRES_USER: ${KPI_PLATFORM_DB_USERNAME:-kpi_user}
      POSTGRES_PASSWORD: ${KPI_PLATFORM_DB_PASSWORD:-kpi_password}
    ports:
      - "55433:5432"
    volumes:
      - kpi-postgres-data:/var/lib/postgresql/data
      - ./backend/kpi-platform/db/init-db.sql:/docker-entrypoint-initdb.d/01-init-kpi-platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KPI_PLATFORM_DB_USERNAME:-kpi_user} -d ${KPI_PLATFORM_BOOTSTRAP_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: cgi-flow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: cgi-flow-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8085:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  discovery-service:
    build:
      context: ./backend/discovery-service
      dockerfile: Dockerfile
    container_name: cgi-flow-discovery-service
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8761/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  auth-user-service:
    build:
      context: ./backend/auth-user-service
      dockerfile: Dockerfile
    container_name: cgi-flow-auth-user-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/cgi_flow_auth
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}/realms/cgi-flow
      KEYCLOAK_REALM: cgi-flow
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/auth/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  employee-service:
    build:
      context: ./backend/employee-service
      dockerfile: Dockerfile
    container_name: cgi-flow-employee-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/cgi_flow_employee
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}/realms/cgi-flow
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      EMPLOYEE_PROFILE_UPLOAD_DIR: /var/lib/cgi-flow/uploads/profiles
      EMPLOYEE_PUBLIC_BASE_URL: ${EMPLOYEE_PUBLIC_BASE_URL:-http://localhost:8082}
    ports:
      - "8082:8082"
    volumes:
      - employee-profile-uploads:/var/lib/cgi-flow/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/api/employees/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  ticket-service:
    build:
      context: ./backend/ticket-service
      dockerfile: Dockerfile
    container_name: cgi-flow-ticket-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-user-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/cgi_flow_ticket
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}/realms/cgi-flow
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      AUTH_USER_SERVICE_BASE_URL: http://auth-user-service:8081
      SERVICES_AUTH_USER_BASE_URL: http://auth-user-service:8081
      SERVICES_AUTH_USER_DIRECTORY_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/cgi_flow_auth
      SERVICES_AUTH_USER_DIRECTORY_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SERVICES_AUTH_USER_DIRECTORY_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/api/tickets/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  sla-service:
    build:
      context: ./backend/sla-service
      dockerfile: Dockerfile
    container_name: cgi-flow-sla-service
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/api/sla/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  messaging-service:
    build:
      context: ./backend/messaging-service
      dockerfile: Dockerfile
    container_name: cgi-flow-messaging-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-user-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/cgi_flow_messaging
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}/realms/cgi-flow
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      AUTH_USER_SERVICE_BASE_URL: http://auth-user-service:8081
      TICKET_SERVICE_BASE_URL: http://ticket-service:8083
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/api/messages/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  planning-service:
    build:
      context: ./backend/planning-service
      dockerfile: Dockerfile
    container_name: cgi-flow-planning-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      PLANNING_DATABASE_URL: jdbc:postgresql://auth-postgres:5432/cgi_flow_planning
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}/realms/cgi-flow
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-account}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      SECURITY_DEV_ADMIN_BYPASS: "false"
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8087/api/plannings/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kpi-platform-auth-service:
    build:
      context: ./backend/kpi-platform
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: auth-service
    container_name: cgi-flow-kpi-platform-auth-service
    depends_on:
      kpi-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      KPI_PLATFORM_AUTH_DB_URL: jdbc:postgresql://kpi-postgres:5432/auth_db
      KPI_PLATFORM_DB_USERNAME: ${KPI_PLATFORM_DB_USERNAME:-kpi_user}
      KPI_PLATFORM_DB_PASSWORD: ${KPI_PLATFORM_DB_PASSWORD:-kpi_password}
      KPI_PLATFORM_SEED_DEMO_USERS: ${KPI_PLATFORM_SEED_DEMO_USERS:-true}
      KPI_PLATFORM_JWT_SECRET: ${KPI_PLATFORM_JWT_SECRET:-kpiSupportDsMagasinSecretKeyVeryLong2024SecureKey!@#$%^&*()}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kpi-platform-agent-service:
    build:
      context: ./backend/kpi-platform
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: agent-service
    container_name: cgi-flow-kpi-platform-agent-service
    depends_on:
      kpi-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kpi-platform-auth-service:
        condition: service_healthy
    environment:
      KPI_PLATFORM_AGENT_DB_URL: jdbc:postgresql://kpi-postgres:5432/agent_db
      KPI_PLATFORM_DB_USERNAME: ${KPI_PLATFORM_DB_USERNAME:-kpi_user}
      KPI_PLATFORM_DB_PASSWORD: ${KPI_PLATFORM_DB_PASSWORD:-kpi_password}
      KPI_PLATFORM_JWT_SECRET: ${KPI_PLATFORM_JWT_SECRET:-kpiSupportDsMagasinSecretKeyVeryLong2024SecureKey!@#$%^&*()}
      KPI_PLATFORM_KAFKA_AUTO_STARTUP: "false"
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
    ports:
      - "8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kpi-platform-kpi-service:
    build:
      context: ./backend/kpi-platform
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: kpi-service
    container_name: cgi-flow-kpi-platform-kpi-service
    depends_on:
      kpi-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kpi-platform-agent-service:
        condition: service_healthy
    environment:
      KPI_PLATFORM_KPI_DB_URL: jdbc:postgresql://kpi-postgres:5432/kpi_db
      KPI_PLATFORM_DB_USERNAME: ${KPI_PLATFORM_DB_USERNAME:-kpi_user}
      KPI_PLATFORM_DB_PASSWORD: ${KPI_PLATFORM_DB_PASSWORD:-kpi_password}
      KPI_PLATFORM_AGENT_BASE_URL: http://kpi-platform-agent-service:8092
      KPI_PLATFORM_JWT_SECRET: ${KPI_PLATFORM_JWT_SECRET:-kpiSupportDsMagasinSecretKeyVeryLong2024SecureKey!@#$%^&*()}
      KPI_PLATFORM_KAFKA_AUTO_STARTUP: "false"
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
    ports:
      - "8094:8094"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8094/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kpi-platform-nps-service:
    build:
      context: ./backend/kpi-platform
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: nps-service
    container_name: cgi-flow-kpi-platform-nps-service
    depends_on:
      kpi-postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kpi-platform-agent-service:
        condition: service_healthy
    environment:
      KPI_PLATFORM_NPS_DB_URL: jdbc:postgresql://kpi-postgres:5432/nps_db
      KPI_PLATFORM_DB_USERNAME: ${KPI_PLATFORM_DB_USERNAME:-kpi_user}
      KPI_PLATFORM_DB_PASSWORD: ${KPI_PLATFORM_DB_PASSWORD:-kpi_password}
      KPI_PLATFORM_AGENT_BASE_URL: http://kpi-platform-agent-service:8092
      KPI_PLATFORM_JWT_SECRET: ${KPI_PLATFORM_JWT_SECRET:-kpiSupportDsMagasinSecretKeyVeryLong2024SecureKey!@#$%^&*()}
      KPI_PLATFORM_KAFKA_AUTO_STARTUP: "false"
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8095/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  kpi-platform-frontend:
    build:
      context: ./KPI-FRONTEND
      dockerfile: Dockerfile
    container_name: cgi-flow-kpi-platform-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5180:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  quality-lab-ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: cgi-flow-quality-lab-ai
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      QUALITY_LAB_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@auth-postgres:5432/quality_lab
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: cgi-flow-api-gateway
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-user-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      sla-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      planning-service:
        condition: service_healthy
      kpi-platform-auth-service:
        condition: service_healthy
      kpi-platform-agent-service:
        condition: service_healthy
      kpi-platform-kpi-service:
        condition: service_healthy
      kpi-platform-nps-service:
        condition: service_healthy
      quality-lab-ai:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka
      AI_SERVICE_BASE_URL: http://quality-lab-ai:8001
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/auth/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./FRONTCODED
      dockerfile: Dockerfile
    container_name: cgi-flow-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api-gateway:8080
      VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://host.docker.internal:8085}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-cgi-flow}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-cgi-flow-web}
      VITE_PLANNING_DEV_ADMIN_BYPASS: ${VITE_PLANNING_DEV_ADMIN_BYPASS:-false}
      VITE_KPI_MODULE_URL: ${VITE_KPI_MODULE_URL:-http://localhost:5180/kpi-app/}
      VITE_KPI_APP_PROXY_TARGET: http://kpi-platform-frontend
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  auth-postgres-data:
  kpi-postgres-data:
  kafka-data:
  employee-profile-uploads:
  keycloak-data:
