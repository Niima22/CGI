server:
  port: ${KPI_PLATFORM_AUTH_PORT:8091}

spring:
  application:
    name: kpi-platform-auth-service

  datasource:
    url: ${KPI_PLATFORM_AUTH_DB_URL:jdbc:postgresql://localhost:55433/auth_db}
    username: ${KPI_PLATFORM_DB_USERNAME:kpi_user}
    password: ${KPI_PLATFORM_DB_PASSWORD:kpi_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${KPI_PLATFORM_AUTH_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${KPI_PLATFORM_JWT_SECRET:kpiSupportDsMagasinSecretKeyVeryLong2024SecureKey!@#$%^&*()}
    expiration-ms: ${KPI_PLATFORM_JWT_EXPIRATION_MS:28800000}

kpi-platform:
  seed-demo-users: ${KPI_PLATFORM_SEED_DEMO_USERS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.support.kpi: DEBUG
    org.springframework.security: WARN
